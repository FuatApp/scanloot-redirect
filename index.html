<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScanLoot - eBay Verbindung</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0D0D1A;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #1A1A2E;
            border-radius: 20px;
            padding: 40px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 32px rgba(90, 75, 209, 0.3);
        }
        .icon { font-size: 48px; margin-bottom: 16px; }
        h1 { font-size: 22px; margin: 0 0 8px; }
        p { color: #aaa; font-size: 14px; line-height: 1.5; }
        .code-box {
            background: #0D0D1A;
            border: 1px solid #5A4BD1;
            border-radius: 12px;
            padding: 16px;
            margin: 20px 0;
            word-break: break-all;
            font-family: monospace;
            font-size: 12px;
            color: #5A4BD1;
            user-select: all;
        }
        .btn {
            display: inline-block;
            background: #5A4BD1;
            color: #fff;
            padding: 14px 32px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            margin-top: 12px;
        }
        .btn:active { opacity: 0.8; }
        .hint { color: #666; font-size: 12px; margin-top: 16px; }
        .success { color: #00E676; }
        .spinner {
            border: 3px solid #333;
            border-top: 3px solid #5A4BD1;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card" id="content">
        <div class="spinner"></div>
        <h1>Verbinde mit ScanLoot...</h1>
        <p>Einen Moment bitte.</p>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const card = document.getElementById('content');

        if (code) {
            // MUST encode - eBay codes contain # which breaks URIs
            const deepLink = 'cardscanner://ebay_de-callback?code=' + encodeURIComponent(code);
            window.location.href = deepLink;

            // After 2 seconds, show manual fallback
            setTimeout(function() {
                card.innerHTML =
                    '<div class="icon">&#x2705;</div>' +
                    '<h1 class="success">eBay verbunden!</h1>' +
                    '<p>Falls die App sich nicht automatisch oeffnet, kopiere diesen Code und fuege ihn in der App ein:</p>' +
                    '<div class="code-box" onclick="copyCode()">' + code + '</div>' +
                    '<a class="btn" href="' + deepLink + '">App oeffnen</a>' +
                    '<p class="hint">Tippe auf den Code um ihn zu kopieren</p>';
            }, 2000);
        } else {
            card.innerHTML =
                '<div class="icon">&#x274C;</div>' +
                '<h1>Verbindung fehlgeschlagen</h1>' +
                '<p>Kein Autorisierungscode erhalten. Bitte versuche es erneut in der App.</p>';
        }

        function copyCode() {
            if (code) {
                navigator.clipboard.writeText(code).then(function() {
                    alert('Code kopiert!');
                });
            }
        }
    </script>
</body>
</html>
