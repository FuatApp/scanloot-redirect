<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScanLoot - eBay Verbindung</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0D0D1A;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #1A1A2E;
            border-radius: 20px;
            padding: 40px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 32px rgba(90, 75, 209, 0.3);
        }
        .icon { font-size: 56px; margin-bottom: 12px; }
        h1 { font-size: 22px; margin: 0 0 8px; }
        p { color: #aaa; font-size: 14px; line-height: 1.5; margin: 8px 0; }
        .code-box {
            background: #0D0D1A;
            border: 1px solid #5A4BD1;
            border-radius: 12px;
            padding: 16px;
            margin: 20px 0;
            word-break: break-all;
            font-family: monospace;
            font-size: 12px;
            color: #5A4BD1;
            user-select: all;
        }
        .btn {
            display: block;
            background: #5A4BD1;
            color: #fff;
            padding: 16px 24px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 17px;
            margin: 16px 0 8px;
            border: none;
            width: 100%;
            box-sizing: border-box;
            cursor: pointer;
        }
        .btn:active { opacity: 0.8; }
        .btn-secondary {
            background: transparent;
            color: #aaa;
            border: 1px solid #333;
            font-size: 14px;
            font-weight: 500;
        }
        .hint { color: #666; font-size: 12px; margin-top: 16px; }
        .success { color: #00E676; }
    </style>
</head>
<body>
    <div class="card" id="content">
        <div class="icon">&#x2705;</div>
        <h1 class="success">eBay verbunden!</h1>
        <p>Tippe auf den Button, um zur&uuml;ck zu ScanLoot zu wechseln.</p>
        <a class="btn" id="openBtn" href="#">ScanLoot &ouml;ffnen</a>
        <p class="hint">Falls nichts passiert: Code kopieren und manuell zur App wechseln</p>
        <div class="code-box" id="codeBox" onclick="copyCode()">&hellip;</div>
    </div>

    <script>
        // iOS Safari greys out the "open in another app" dialog buttons for
        // ~2 seconds when the redirect is auto-triggered on page load (not
        // user-initiated). That lock-out plus our crash on resume made the
        // eBay-connect flow unrecoverable from the user's side.
        //
        // Fix: never auto-redirect. Render a button immediately and let the
        // user tap it — iOS then allows the dialog through with active
        // Allow/Disallow buttons, no waiting, no greyed state. We also pre-
        // copy the code to the clipboard so the in-app paste fallback works
        // if the user dismisses the dialog by accident.
        var params = new URLSearchParams(window.location.search);
        var code = params.get('code');
        var state = params.get('state');
        var card = document.getElementById('content');
        var btn = document.getElementById('openBtn');
        var codeBox = document.getElementById('codeBox');

        if (code) {
            // Forward the anti-CSRF `state` nonce back to the app so its
            // verifier can match it (the app accepts a missing state for
            // backwards-compat, but forwarding it restores full protection).
            var deepLink = 'cardscanner://ebay_de-callback?code=' +
                encodeURIComponent(code);
            if (state) {
                deepLink += '&state=' + encodeURIComponent(state);
            }
            btn.href = deepLink;
            codeBox.textContent = code;
            try { navigator.clipboard.writeText(code); } catch (e) {}
            // Auto-jump back into the app. The previous version never did this,
            // so the in-app spinner hung forever unless the user noticed and
            // tapped the button. A short delay (NOT on-load) sidesteps iOS
            // Safari's ~2s greyed "open in app" lock-out; on Android it fires
            // immediately. The button below stays as a manual fallback if the
            // OS blocks the programmatic navigation.
            setTimeout(function () {
                window.location.href = deepLink;
            }, 600);
        } else {
            card.innerHTML =
                '<div class="icon">&#x274C;</div>' +
                '<h1>Verbindung fehlgeschlagen</h1>' +
                '<p>Kein Autorisierungscode erhalten. Bitte versuche es ' +
                'erneut in der App.</p>';
        }

        function copyCode() {
            if (!code) return;
            navigator.clipboard.writeText(code).then(function() {
                codeBox.textContent = 'Kopiert! ' + code;
            });
        }
    </script>
</body>
</html>
